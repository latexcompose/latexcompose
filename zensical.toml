[project]
site_url = "https://latexcompose.github.io/"
site_name = "latexcompose"
site_description = "Library to generate LaTeX code and to build extensions on top of this library"
site_author = "Marco Wehnert"

copyright = "Copyright &copy; 2026 Marco Wehnert"

repo_url = "https://github.com/latexcompose/latexcompose"
repo_name = "latexcompose/latexcompose"
# edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },

  { "Getting started" = [
    "getting-started/installation.md",
    "getting-started/first-steps.md",
    "getting-started/tutorial.md",
  ] },

  { "Guide" = [
    "guide/index.md",
    "guide/fundamentals.md",
    "guide/examples.md",
    "guide/examples/hello_world.md",
    "guide/extensions.md",
  ]},

  { "Reference" = [
    "reference/index.md",
    { "TeX/LaTeX commands" = [
      "reference/latex-commands/index.md",
      { "B" = [
        { "\\begin" = "reference/latex-commands/begin.md" },
      ] },
      { "D" = [
        { "\\documentclass" = "reference/latex-commands/documentclass.md" },
      ] },
      { "E" = [
        { "\\end" = "reference/latex-commands/end.md" },
      ] },
      { "M" = [
        { "\\maketitle" = "reference/latex-commands/maketitle.md" },
      ] },
      { "T" = [
        { "\\textbf" = "reference/latex-commands/textbf.md" },
      ] },
      { "U" = [
        { "\\usepackage" = "reference/latex-commands/usepackage.md" },
      ] },
    ]},
  ]},

  { "API" = [
    "api/base.md",
    "api/exceptions.md",
    "api/io.md",
    "api/latex.md",
    "api/tokens.md",
  ] },

  { "Zensical" = [
    "zensical/zensical.md",
    "zensical/markdown.md",
  ] },
]

extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

[project.theme.icon.admonition]
example = "lucide/file-code"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
docstring_section_style = "table"
merge_init_into_class = false
parameter_headings = true
separate_signature = true
show_signature = true
show_signature_annotations = true
show_root_heading = true
show_source = false
show_symbol_type_toc = true
show_symbol_type_heading = true
show_submodules = false
show_if_no_docstring = true
show_root_toc_entry = false