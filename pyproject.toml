[project]
name = "latexcompose"
version = "0.0.0"
description = "Library to generate LaTeX code and to build extensions on top of this library"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocstrings-python>=2.0.10",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "zensical>=0.0.73",
]
